default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        additional_dependencies: ["ruff==0.16.2"]
        # Frozen source evidence is verified by the adjacent SHA-256 manifest.
        exclude: ^evaluation/unlearning/(jupiter_rmu_20261024/(source_snapshot/|historical_bbq_metrics\.py$)|warbias_primary_20261031/data/build_streams\.py$)
      - id: ruff-format
        additional_dependencies: ["ruff==0.16.2"]
        exclude: ^evaluation/unlearning/(jupiter_rmu_20261024/(source_snapshot/|historical_bbq_metrics\.py$)|warbias_primary_20261031/data/build_streams\.py$)
